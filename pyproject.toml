[project]
name = "bio-inspired-optimisation"
version = "0.1.0"
description = "Bio-Inspired Optimisation exercises and Streamlit documentation"
readme = "README.md"
authors = [
    { name = "Phoenix", email = "6veles6@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "streamlit>=1.67.0",
]

[project.scripts]
bio-inspired-optimisation = "bio_inspired_optimisation:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
